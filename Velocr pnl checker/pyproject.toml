[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "velocr-pnl"
version = "0.1.0"
description = "Velocr NFT PnL — Moralis marketplace trades + mint detection"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3.0"]
dev = ["discord.py>=2.3.0", "httpx>=0.27.0"]

# No [project.scripts]: on some Windows global Python installs, pip cannot write
# to C:\\Python312\\Scripts (WinError 2 on *.exe). Use a venv, or:
#   python -m velocr_pnl --help
#   python -m uvicorn velocr_pnl.web_app:app --host 127.0.0.1 --port 8080

[tool.setuptools.packages.find]
where = ["."]
include = ["velocr_pnl*"]
