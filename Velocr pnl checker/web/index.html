<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFT PNL Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="kol-landing-body">
  <div class="kol-bg" aria-hidden="true"></div>

  <header class="kol-topbar">
    <div class="brand-stack">
      <img
        class="brand-logo-img"
        src="/static/velocr-brand-logo.png"
        width="52"
        height="52"
        alt="NFT PNL Checker"
        decoding="async"
      />
      <div class="brand-copy">
        <a href="/" class="brand-title">NFT PNL Checker</a>
        <span class="brand-by">By VELCOR3</span>
      </div>
    </div>
  </header>

  <main class="kol-hero">
    <div class="kol-hero-intro">
      <h1 class="kol-title kol-title--hero">NFT PNL Checker</h1>
      <p class="kol-hero-by">By VELCOR3</p>
    </div>

    <form class="kol-form" id="landing-form" autocomplete="off">
      <div class="kol-search-row">
        <input
          type="text"
          id="landing-wallet"
          name="wallet"
          placeholder="Enter wallet address"
          spellcheck="false"
          maxlength="42"
        />
        <button type="submit" class="kol-search-btn" aria-label="Search" title="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
      <div class="kol-filters-row">
        <select id="landing-chain" aria-label="Blockchain">
          <option value="eth" selected>Ethereum</option>
          <option value="base">Base</option>
          <option value="polygon">Polygon</option>
          <option value="arbitrum">Arbitrum</option>
          <option value="optimism">Optimism</option>
        </select>
        <select id="landing-range" aria-label="Time range">
          <option value="30">Last 30 days</option>
          <option value="90" selected>Last 90 days</option>
          <option value="365">Last 365 days</option>
          <option value="0">All time</option>
        </select>
      </div>
    </form>

    <section class="kol-activity-section" aria-labelledby="activity-heading">
      <h2 id="activity-heading" class="kol-activity-title">Search activity</h2>
      <p class="kol-activity-hint">Recent lookups on this device — open a wallet to see full stats on the next page.</p>
      <div class="kol-activity-box">
        <ul class="kol-activity-list" id="activity-list"></ul>
      </div>
    </section>
  </main>

  <footer class="kol-foot">NFT PNL Checker · VELCOR3 · Moralis data · Not financial advice</footer>

  <a
    class="site-x-corner"
    href="https://x.com/V3LCOR3"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="VELCOR3 on X (opens in new tab)"
  >
    <svg class="site-x-bird" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
    </svg>
    <span class="site-x-label">x.com/V3LCOR3</span>
  </a>

  <script src="/static/landing.js" defer></script>
</body>
</html>
