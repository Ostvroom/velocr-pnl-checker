<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet · NFT PNL Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="dash-body">
  <div class="kol-bg dash-bg" aria-hidden="true"></div>
  <div class="dash-loading" id="dash-loading" aria-live="polite" aria-busy="true">
    <div class="dash-loading-card">
      <div class="dash-loading-spinner" aria-hidden="true"></div>
      <div class="dash-loading-text">
        <strong>Loading wallet</strong>
        <span class="muted">Fetching trades, collections, and activity…</span>
      </div>
    </div>
    <div class="dash-skeleton">
      <div class="sk sk-wide"></div>
      <div class="sk sk-mid"></div>
      <div class="sk sk-mid"></div>
      <div class="sk sk-wide"></div>
    </div>
  </div>

  <header class="dash-brand-bar" aria-label="App name">
    <div class="dash-brand-inner">
      <a href="/" class="dash-brand-home">
        <img
          class="dash-brand-logo"
          src="/static/velocr-brand-logo.png"
          width="44"
          height="44"
          alt="NFT PNL Checker"
          decoding="async"
        />
        <div class="dash-brand-text">
          <span class="dash-brand-title">NFT PNL Checker</span>
          <span class="dash-brand-by">By VELCOR3</span>
        </div>
      </a>
    </div>
  </header>

  <header class="dash-top">
    <a href="/" class="dash-back">← Home</a>
    <div class="dash-wallet-block">
      <span class="dash-wallet-label">Wallet</span>
      <span class="dash-wallet" id="dash-wallet">—</span>
      <span class="dash-chain-pill" id="dash-chain-pill">ETH</span>
    </div>
    <div class="dash-time-pills" id="dash-time-pills" role="tablist" aria-label="Time range">
      <button type="button" data-days="1" class="dash-pill">1d</button>
      <button type="button" data-days="3" class="dash-pill">3d</button>
      <button type="button" data-days="7" class="dash-pill">7d</button>
      <button type="button" data-days="14" class="dash-pill">14d</button>
      <button type="button" data-days="30" class="dash-pill">30d</button>
      <button type="button" data-days="90" class="dash-pill is-active">90d</button>
      <button type="button" data-days="365" class="dash-pill">365d</button>
      <button type="button" data-days="0" class="dash-pill">All</button>
    </div>
  </header>

  <main class="dash-main">
    <div id="dash-error" class="error-banner" hidden></div>

    <section class="dash-row-2">
      <div class="dash-card dash-card-stats">
        <h2 class="dash-card-title">Stats</h2>
        <dl class="dash-stats-dl" id="dash-stats"></dl>
      </div>
      <div class="dash-card dash-card-trades">
        <h2 class="dash-card-title dash-card-title--trades">NFT trades</h2>
        <ul class="dash-trade-list trade-list" id="dash-trade-list"></ul>
      </div>
    </section>

    <section class="dash-card dash-token-section">
      <div class="dash-card-head">
        <h2 class="dash-card-title">Collections</h2>
        <span class="muted" id="dash-token-summary"></span>
      </div>
      <div class="dash-token-grid" id="dash-token-grid"></div>
    </section>
  </main>

  <a
    class="site-x-corner"
    href="https://x.com/V3LCOR3"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="VELCOR3 on X (opens in new tab)"
  >
    <svg class="site-x-bird" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
    </svg>
    <span class="site-x-label">x.com/V3LCOR3</span>
  </a>

  <script src="/static/dashboard.js" defer></script>
</body>
</html>
